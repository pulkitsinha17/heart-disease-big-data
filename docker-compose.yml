services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "bWgWBJF8TOmeqIISdbQ7ng"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  namenode:
    image: apache/hadoop:3
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c", "sudo chown -R hadoop:hadoop /data && /opt/starter.sh hdfs namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    env_file:
      - ./docker/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /data/namenode/current
      HDFS-SITE.XML_dfs.namenode.name.dir: /data/namenode
    volumes:
      - hadoop_namenode:/data/namenode
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/dfshealth.html > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  datanode:
    image: apache/hadoop:3
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c", "sudo chown -R hadoop:hadoop /data && /opt/starter.sh hdfs datanode"]
    ports:
      - "9864:9864"
    depends_on:
      namenode:
        condition: service_healthy
    env_file:
      - ./docker/hadoop.env
    environment:
      WAITFOR: namenode:9000
      HDFS-SITE.XML_dfs.datanode.data.dir: /data/datanode
    volumes:
      - hadoop_datanode:/data/datanode
    networks:
      - bigdata-net

volumes:
  kafka_data:
    name: heart_disease_kafka_data
  hadoop_namenode:
    name: heart_disease_hadoop_namenode
  hadoop_datanode:
    name: heart_disease_hadoop_datanode

networks:
  bigdata-net:
    name: heart_disease_bigdata_net
    driver: bridge
